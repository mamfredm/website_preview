<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e0e0e">
  <title>Click-Capybara · Max</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main>
    <a class="marke" href="https://click-capybara.com" aria-label="Click-Capybara, zur Website">
      <img src="/assets/logo.svg" width="36" height="36" alt="">
      <span>Click-Capybara</span><span class="caret" aria-hidden="true"></span>
    </a>

    <section class="buehne">
      <p class="vorzeile">Google Ads · Websites · Lokale Sichtbarkeit</p>
      <h1>Schön, dass du <span class="name">da bist.</span></h1>
      <p class="einleitung">Speicher dir meinen Kontakt oder schau dir an, was ich für Unternehmen wie deins mache.</p>

      <a class="knopf knopf-haupt" href="/kontakt.vcf">
        <span>Max als Kontakt speichern<small>Name, E-Mail und Website</small></span>
        <span class="pfeil" aria-hidden="true">＋</span>
      </a>

      <a class="knopf knopf-neben" href="https://click-capybara.com">
        <span>Zur Website<small>click-capybara.com</small></span>
        <span class="pfeil" aria-hidden="true">→</span>
      </a>
    </section>
  </main>

  <footer>
    <a href="https://click-capybara.com/impressum">Impressum</a>
    <a href="https://click-capybara.com/privacy">Datenschutz</a>
  </footer>

  <!-- Vorschau-Übersicht: nur auf Cloudflare-Testadressen (Branch/Commit), nie auf preview.click-capybara.com -->
  <script>
  (function () {
    if (!/\.website-preview-4pv\.pages\.dev$/.test(location.hostname)) return;
    fetch('/_vorschau.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d || !d.kunden || !d.kunden.length) return;
      d.kunden.sort(function (a, b) { return (b.geaendert - a.geaendert) || a.ordner.localeCompare(b.ordner); });
      var box = document.createElement('section');
      box.className = 'testliste';
      box.innerHTML = '<p class="vorzeile">Testversion · Branch ' + d.branch.replace(/[<>&]/g, '') + '</p><h2>Kundenseiten</h2>';
      d.kunden.forEach(function (k) {
        var a = document.createElement('a');
        a.className = 'knopf ' + (k.geaendert ? 'knopf-haupt' : 'knopf-neben');
        a.href = '/' + k.ordner + '/website/';
        a.innerHTML = '<span>' + k.ordner + '<small>' + (k.geaendert ? 'In diesem Branch geändert' : 'Unverändert') + '</small></span><span class="pfeil" aria-hidden="true">→</span>';
        box.appendChild(a);
      });
      var main = document.querySelector('main');
      main.insertBefore(box, main.children[1]);
    }).catch(function () {});
  })();
  </script>
</body>
</html>
