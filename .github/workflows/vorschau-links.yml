# Kommentiert in jedem Pull Request die direkten Vorschau-Links
# zu den Kundenordnern, die darin geändert wurden.
name: Vorschau-Links

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const projekt = 'website-preview-4pv.pages.dev';
            const pr = context.payload.pull_request;

            // Cloudflare-Branch-Adresse: klein, Sonderzeichen → "-", max. 28 Zeichen
            const alias = pr.head.ref.toLowerCase().replace(/[^a-z0-9]/g, '-').slice(0, 28).replace(/-+$/, '');
            const basis = `https://${alias}.${projekt}`;

            const dateien = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100
            });

            const gemeinsam = ['assets', '_headers', 'index.html', '404.html', 'kontakt.vcf', '.github', 'README.md', 'neuer-kunde.sh', 'kontaktkarten.sh'];
            const kunden = new Map(); // Kunde → Set der Varianten (website, website-2 …)
            let allgemein = false;
            for (const f of dateien) {
              const teile = f.filename.split('/');
              if (teile.length > 1 && !gemeinsam.includes(teile[0])) {
                if (!kunden.has(teile[0])) kunden.set(teile[0], new Set());
                if (/^(website(-\d+)?|angebot[\w-]*)$/.test(teile[1]) && teile.length > 2) kunden.get(teile[0]).add(teile[1]);
              }
              else if (!['.github', 'README.md', '_redirects'].includes(teile[0])) allgemein = true;
            }

            let text = '<!-- vorschau-links -->\n### 🔗 Vorschau-Links\n\n';
            if (kunden.size) {
              text += '| Kunde | Zwischenseite | Website |\n|---|---|---|\n';
              for (const k of [...kunden.keys()].sort()) {
                const varianten = [...kunden.get(k)].sort();
                if (!varianten.length) varianten.push('website');
                const links = varianten.map(v => `[${k}/${v}/](${basis}/${k}/${v}/)`).join(' · ');
                text += `| **${k}** | [${k}/](${basis}/${k}/) | ${links} |\n`;
              }
            } else {
              text += 'In diesem PR wurde kein Kundenordner geändert.\n';
            }
            if (allgemein) {
              text += `\nGemeinsame Dateien geändert – zum Prüfen: [Startseite](${basis}/) · [Muster-Kunde](${basis}/muster/) · [404-Seite](${basis}/gibt-es-nicht)\n`;
            }
            text += '\n_Die Links funktionieren, sobald Cloudflare oben „Deploy successful“ meldet._';

            // Vorhandenen Kommentar aktualisieren statt bei jedem Push einen neuen anzulegen
            const kommentare = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100
            });
            const alt = kommentare.find(c => c.body && c.body.startsWith('<!-- vorschau-links -->'));
            if (alt) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: alt.id, body: text });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body: text });
            }
